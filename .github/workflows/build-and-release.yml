name: Build & Release Sonic VANE

"on":
  workflow_dispatch:

    inputs:
      version:
        description: 'Release version tag (leave blank to use current date vYYYY.MM.DD)'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release All Platforms
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS files are downloaded
        run: |
          git lfs install
          git lfs pull
          git lfs checkout
          python3 -c "
          import subprocess, sys
          out = subprocess.check_output(['git', 'grep', '-l', 'version https://git-lfs.github.com/spec/v1', 'HEAD'], text=True)
          files = [line.split(':', 1)[1] for line in out.strip().splitlines() if ':' in line]
          failed = []
          for f in files:
              try:
                  with open(f, 'rb') as fp:
                      if fp.read(40).startswith(b'version https://git-lfs'):
                          failed.append(f)
              except OSError:
                  pass
          if failed:
              print(f'ERROR: {len(failed)} Git LFS files were NOT downloaded: {failed[:10]}', file=sys.stderr)
              sys.exit(1)
          print(f'Verified all {len(files)} Git LFS files are fully downloaded.')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Release Version & Tag
        id: version
        run: |
          DATE_STR=$(date +'%Y-%m-%d')
          DATE_TAG=$(date +'%Y.%m.%d')

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_TAG="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_TAG="${{ github.ref_name }}"
          else
            VERSION_TAG="v${DATE_TAG}"
            # Avoid tag collision if multiple commits are pushed on the same date
            if git rev-parse "${VERSION_TAG}" >/dev/null 2>&1; then
              VERSION_TAG="${VERSION_TAG}.${{ github.run_number }}"
            fi
          fi

          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE_STR}" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Building release: ${VERSION_TAG} (${DATE_STR})"

      - name: Cache Godot Editor & Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-x86_64

      - name: Install Godot & Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          GODOT_PKG="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATES_PKG="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"

          echo "Downloading Godot ${GODOT_VERSION}-${GODOT_STATUS}..."
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${GODOT_PKG}"
          unzip -q "${GODOT_PKG}" -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot export templates..."
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${TEMPLATES_PKG}"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          unzip -q "${TEMPLATES_PKG}" -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/

          rm -f "${GODOT_PKG}" "${TEMPLATES_PKG}"
          rm -rf /tmp/godot /tmp/templates

      - name: Verify Godot Installation
        run: |
          godot --version

      - name: Cache Godot Project Import
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-v2-${{ hashFiles('project.godot', 'export_presets.cfg', '.gitattributes') }}
          restore-keys: |
            godot-import-v2-

      - name: Initialize Project Assets (Headless Editor Import)
        run: |
          # In Godot 4, running the editor headlessly is required to build uid_cache.bin,
          # global_script_class_cache.cfg, and imported 3D assets/animations. Two passes
          # ensure all multi-stage dependencies (models -> scenes -> registries) resolve cleanly.
          godot --headless --editor --quit || true
          godot --headless --editor --quit || true

      - name: Stamp Version into project.godot
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Stamping version: ${VERSION}"
          if grep -q 'config/version=' project.godot; then
            sed -i "s|^config/version=.*|config/version=\"${VERSION}\"|" project.godot
          else
            sed -i "/^config\/icon=/a config/version=\"${VERSION}\"" project.godot
          fi
          echo "Resulting [application] section:"
          sed -n '/^\[application\]/,/^\[/p' project.godot | head -10

      - name: Export Executables, Packs & Assemble Data Folders
        run: |
          python3 .github/scripts/build.py \
            --godot-bin godot \
            --output-dir dist \
            --platforms all \
            --archive \
            --version-tag "${{ steps.version.outputs.version }}"

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SonicVANE-All-Platforms-${{ steps.version.outputs.version }}
          path: dist/*.zip
          retention-days: 14

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog since $PREV_TAG..."
            LOG_OUTPUT=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h by @%an)" --no-merges)
          else
            echo "No previous tag found, taking latest 15 commits..."
            LOG_OUTPUT=$(git log -n 15 --pretty=format:"- %s (%h by @%an)" --no-merges)
          fi

          if [ -z "$LOG_OUTPUT" ]; then
            LOG_OUTPUT="- Minor updates and improvements."
          fi

          {
            echo "changelog<<EOF"
            echo "$LOG_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Sonic VANE ${{ steps.version.outputs.version }} (${{ steps.version.outputs.date }})
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Sonic VANE (LS5 Engine 3) - ${{ steps.version.outputs.version }}

            ### Included Builds:
            - **Windows**: `SonicVANE-Windows-${{ steps.version.outputs.version }}.zip`
            - **Linux**: `SonicVANE-Linux-${{ steps.version.outputs.version }}.zip`
            - **macOS**: `SonicVANE-macOS-${{ steps.version.outputs.version }}.zip`

            ### Changelog:
            ${{ steps.changelog.outputs.changelog }}

      - name: Trigger Website Rebuild
        if: ${{ !(github.event.inputs.draft == 'true') }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DEPLOY_TOKEN }}" \
            https://api.github.com/repos/Team-VANE/Team-VANE.github.io/dispatches \
            -d '{"event_type": "new-release"}'
